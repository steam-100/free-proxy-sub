name: Update Proxy List

on:
  schedule:
    # Run every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch:

# We only need write access for force-pushing to the orphan 'data' branch.
permissions:
  contents: write
  pages: write
  id-token: write

# Cancel an in-flight run if a new one starts (prevents push race conditions
# when a manual dispatch overlaps with the scheduled cron).
concurrency:
  group: update-proxy-list
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Convert proxies
        run: python convert.py

      # Force-push the output/ directory to an orphan 'data' branch.
      # This keeps main's git history clean (no chore: spam every 30 min)
      # while still serving the latest list via raw.githubusercontent.com.
      - name: Publish outputs to data branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ts=$(date -u +'%Y-%m-%d %H:%M UTC')

          pushd output
          git init -q -b data
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "data: ${ts}"
          git push -q -f \
            "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" \
            data:data
          popd

  deploy-pages:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pull the data branch — this is where output files now live as a
      # single force-pushed commit.
      - uses: actions/checkout@v4
        with:
          ref: data

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
