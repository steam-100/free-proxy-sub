name: Update Proxy List

on:
  schedule:
    # Every 2 hours at :13 (offset from :00 to dodge GitHub cron congestion).
    # Matches typical client refresh cadence; upstream sources update at
    # most hourly, so 2h is well within freshness budget.
    - cron: '13 */2 * * *'
  workflow_dispatch:

# Only need write access to push to the orphan 'data' branch.
permissions:
  contents: write

# Cancel an in-flight run if a new one starts (prevents push race conditions
# when a manual dispatch overlaps with the scheduled cron).
concurrency:
  group: update-proxy-list
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Convert proxies
        run: python convert.py

      # Force-push the output/ directory to an orphan 'data' branch.
      # This keeps master's git history clean while still serving the
      # latest list via raw.githubusercontent.com / jsdelivr / ghproxy.
      - name: Publish outputs to data branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ts=$(date -u +'%Y-%m-%d %H:%M UTC')

          pushd output
          git init -q -b data
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "data: ${ts}"
          git push -q -f \
            "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" \
            data:data
          popd
